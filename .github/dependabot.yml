version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain npm dependencies - production (frontend vendor libraries, copied into
  # resources/js/external by the Ant "vendor" target - see scripts/copy-vendor-libs.js)
  # Disabled for now (open-pull-requests-limit: 0) - these are pinned to exact,
  # verified versions matching what's actually deployed; re-enable once that's settled.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "production"
    groups:
      npm-production:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain npm dependencies - development (build/test tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "development"
    groups:
      npm-development:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
