version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain npm dependencies. Dependabot allows only one npm entry per directory
  # (and target-branch), so production and development are separate groups here.
  # Production = frontend vendor libraries (copied into resources/{js,css}/external by
  # the Ant "vendor" target - see scripts/copy-vendor-libs.js; those folders are
  # gitignored, so a bump only touches package.json and the lockfile). They are pinned
  # to exact versions. Packages that are behind a major release for a known reason
  # (see package.json "dependencies" notes) only have major updates ignored, so
  # minor/patch bumps still come through. The alpheios packages use odd prerelease
  # version strings and are ignored completely.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "alpheios-components"
      - dependency-name: "alpheios-embedded"
      # bootstrap 3 -> 5 needs a template-wide markup migration
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
      # all d3 code targets the v3 API (d3sparql.js and friends)
      - dependency-name: "d3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datatables.net"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datatables.net-bs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "slick-carousel"
        update-types: ["version-update:semver-major"]
      # vis-data peer range conflicts with vis-timeline (see .npmrc legacy-peer-deps)
      - dependency-name: "vis-network"
        update-types: ["version-update:semver-major"]
