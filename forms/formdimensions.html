<div class="w3-container list mss" data-toggle="tooltip" data-placement="left" title="Dimensions" id="dimensionsform">
	<div class="w3-half w3-padding">
		<div class="w3-container">
			<label>Height (mm)</label>
			<br />
			<input data-template="app:heightInput" />
		</div>
		<div class="w3-container">
			<label>Width (mm)</label>
			<br />
			<input data-template="app:widthInput" />
		</div>
		<div class="w3-container">
			<label>Thickness (mm)</label>
			<br />
			<input data-template="app:depthInput" />
		</div>
		<div class="w3-container">
			<label>Columns per page</label>
			<br />
			<input data-template="app:columnsNumInput" />
		</div>
	</div>
	<div class="w3-half w3-padding">
		<div class="w3-container">
			<label>Top Margin</label>
			<br />
			<input data-template="app:tmarginInput" />
		</div>
		<div class="w3-container">
			<label>Bottom Margin</label>
			<br />
			<input data-template="app:bmarginInput" />
		</div>
		<div class="w3-container">
			<label>Right Margin</label>
			<br />
			<input data-template="app:rmarginInput" />
		</div>
		<div class="w3-container">
			<label>Left Margin</label>
			<br />
			<input data-template="app:lmarginInput" />
		</div>
		<div class="w3-container">
			<label>Intercolumn</label>
			<br />
			<input data-template="app:intercolumnInput" />
		</div>
	</div>
</div>
